<svg viewBox="0 0 600 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#966cf5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#966cf5" stop-opacity="0"/>
    </radialGradient>
    
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <circle cx="320" cy="240" r="210" fill="url(#purple-glow)"/>

  <!-- ================= CARD 1: WORKSHOP & CREATIVE MEETUP (TOP LEFT) ================= -->
  <g filter="url(#drop-shadow)" transform="translate(60, 40) rotate(-4)">
    <rect x="0" y="0" width="270" height="170" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Header Pill -->
    <rect x="18" y="18" width="85" height="22" rx="11" fill="#2563eb" fill-opacity="0.12"/>
    <text x="60" y="33" font-family="sans-serif" font-size="10" font-weight="800" fill="#2563eb" text-anchor="middle">WORKSHOP</text>

    <!-- Faceless Instructors/Collaborators -->
    <g transform="translate(180, 20)">
      <!-- Person A -->
      <circle cx="16" cy="12" r="10" fill="#f97316"/>
      <path d="M 6 32 C 6 22, 10 20, 16 20 C 22 20, 26 22, 26 32 Z" fill="#f97316"/>
      <!-- Person B (Overlapping) -->
      <circle cx="36" cy="12" r="10" fill="#966cf5"/>
      <path d="M 26 32 C 26 22, 30 20, 36 20 C 42 20, 46 22, 46 32 Z" fill="#966cf5"/>
    </g>

    <text x="18" y="70" font-family="sans-serif" font-size="16" font-weight="800" fill="#0f172a">UI/UX Design Sprint</text>
    <text x="18" y="88" font-family="sans-serif" font-size="12" fill="#64748b">Hands-on Team Session</text>

    <!-- Progress / Seat Count Bar -->
    <rect x="18" y="115" width="234" height="32" rx="10" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="32" y="135" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155">12 Seats Remaining</text>
    <circle cx="225" cy="131" r="6" fill="#10b981"/>
  </g>

  <!-- ================= CARD 2: LIVE CONCERT & FESTIVAL (BOTTOM RIGHT) ================= -->
  <g filter="url(#drop-shadow)" transform="translate(240, 180) rotate(3)">
    <rect x="0" y="0" width="300" height="210" rx="20" fill="#1e3a8a"/>
    
    <!-- Decorative Ambient Lights -->
    <circle cx="250" cy="40" r="50" fill="#966cf5" opacity="0.4"/>
    <circle cx="40" cy="180" r="60" fill="#f97316" opacity="0.3"/>

    <!-- Faceless Cheering Audience in Card -->
    <g fill="#ffffff" opacity="0.9">
      <!-- Person 1 -->
      <circle cx="60" cy="100" r="11"/>
      <path d="M 48 140 C 48 115, 52 110, 60 110 C 68 110, 72 115, 72 140 Z"/>
      <path d="M 50 112 L 38 90 L 44 86 L 58 110 Z"/> <!-- Arm raised -->

      <!-- Person 2 (Center performer / fan) -->
      <circle cx="130" cy="90" r="13" fill="#f97316"/>
      <path d="M 115 140 C 115 108, 120 102, 130 102 C 140 102, 145 108, 145 140 Z" fill="#f97316"/>
      <path d="M 118 105 L 100 75 L 108 70 L 124 102 Z" fill="#f97316"/>
      <path d="M 142 105 L 160 75 L 152 70 L 136 102 Z" fill="#f97316"/>

      <!-- Person 3 -->
      <circle cx="200" cy="100" r="11"/>
      <path d="M 188 140 C 188 115, 192 110, 200 110 C 208 110, 212 115, 212 140 Z"/>
      <path d="M 202 112 L 214 90 L 220 94 L 206 110 Z"/>
    </g>

    <!-- Card Details -->
    <text x="24" y="172" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">Indie Music Night</text>
    <text x="24" y="192" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Downtown Amphitheater</text>
  </g>

  <!-- ================= FLOATING ACCESSORIES ================= -->
  <!-- Floating Location Pin -->
  <g filter="url(#drop-shadow)" transform="translate(460, 80)">
    <circle cx="25" cy="25" r="25" fill="#f97316"/>
    <path d="M 25 12 C 19 12 14 17 14 23 C 14 31 25 40 25 40 C 25 40 36 31 36 23 C 36 17 31 12 25 12 Z M 25 26 C 23.3 26 22 24.7 22 23 C 22 21.3 23.3 20 25 20 C 26.7 20 28 21.3 28 23 C 28 24.7 26.7 26 25 26 Z" fill="#ffffff"/>
  </g>

  <!-- Floating Ticket Stub -->
  <g filter="url(#drop-shadow)" transform="translate(80, 280) rotate(-8)">
    <rect x="0" y="0" width="140" height="70" rx="12" fill="#ffffff"/>
    <text x="14" y="28" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a">ADMIT ONE</text>
    <text x="14" y="46" font-family="sans-serif" font-size="10" font-weight="700" fill="#966cf5">#EH-9942</text>
    <circle cx="120" cy="35" r="12" fill="#10b981" fill-opacity="0.2"/>
    <path d="M115 35 l3 3 l7 -7" fill="none" stroke="#10b981" stroke-width="2.5"/>
  </g>
</svg>
