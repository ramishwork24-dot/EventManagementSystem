<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Accent Warm Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Electric Violet VIP Gradient -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Subtle Central Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Light Reflection -->
  <circle cx="100" cy="100" r="80" fill="url(#coreGlow)" opacity="0.6" />

  <!-- Dynamic Overlapping Ribbon Flurry -->
  <g transform="rotate(-12 100 100)">
    <!-- Primary Blue Wing -->
    <path d="M 100 100 C 65 25, 145 15, 170 70 C 185 105, 135 130, 100 100 Z" fill="url(#blueGrad)" opacity="0.92" />

    <!-- Accent Orange Flare -->
    <path d="M 100 100 C 145 55, 188 110, 155 158 C 128 188, 75 152, 100 100 Z" fill="url(#orangeGrad)" opacity="0.90" />

    <!-- Electric Violet Prism -->
    <path d="M 100 100 C 132 145, 70 188, 40 152 C 15 118, 58 78, 100 100 Z" fill="url(#violetGrad)" opacity="0.88" />

    <!-- Emerald Accent Burst -->
    <path d="M 100 100 C 58 128, 12 78, 42 38 C 68 8, 118 48, 100 100 Z" fill="url(#emeraldGrad)" opacity="0.90" />
  </g>

  <!-- Intersecting Core Light -->
  <circle cx="100" cy="100" r="16" fill="#FFFFFF" opacity="0.9" />
  <circle cx="100" cy="100" r="9" fill="url(#orangeGrad)" />
</svg>
